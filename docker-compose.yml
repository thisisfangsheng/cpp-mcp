# D-3 / D-5：mcp-server 不映射公网端口，caddy 为唯一 443 入口
services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-cpp-sdk:1.0.0
    # 不设 container_name，以便 `docker compose up -d --scale mcp-server=N`（D-8）
    restart: unless-stopped
    stop_grace_period: 15s           # FR-14：留出优雅停机时间
    env_file:
      - .env                         # D-6：token 只从 .env 注入，不入库、不进镜像
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
      MCP_THREADS: "1"
      MCP_SERVER_NAME: "mcp-cpp-example"
      MCP_SERVER_VERSION: "1.0.0"
    expose:
      - "8080"                       # 仅容器网络内可达
    networks:
      - mcpnet
    read_only: true                  # NFR-5：只读 rootfs
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    # D-8：无状态线协议，直接 --scale mcp-server=3 即可水平扩展

  caddy:
    image: caddy:2-alpine
    container_name: mcp-caddy
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      mcp-server:
        condition: service_healthy   # D-3：健康检查通过后才接入流量
    ports:
      - "443:443"
      - "443:443/udp"                # HTTP/3
    environment:
      DOMAIN: "${DOMAIN:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mcpnet
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

networks:
  mcpnet:
    driver: bridge

volumes:
  caddy_data: {}
  caddy_config: {}
